name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  database:
    name: Migrations, drift check, e2e + concurrency tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Throwaway credentials for a database that lives only for this CI job.
          POSTGRES_USER: jobflow
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: jobflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jobflow -d jobflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: jobflow
      DB_PASSWORD: ci_only_password
      DB_NAME: jobflow
      JWT_SECRET: ci-only-jwt-secret-that-is-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The npm scripts load .env with `node --env-file`, which fails if the file
      # is missing. Variables already in the environment (above) take precedence.
      - run: cp .env.example .env
      - name: Apply all migrations to an empty database
        run: npm run migration:run
      - name: Entities match the migrated schema (no drift)
        run: npm run migration:check
      - name: Migrations are reversible (revert last, re-apply)
        run: npm run migration:revert && npm run migration:run
      - name: E2E and concurrency tests (database jobflow_test)
        run: npm run test:e2e

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag jobflow-api:ci .
