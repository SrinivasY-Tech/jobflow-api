name: jobflow

# Shared settings for the two services that run the API image.
x-app: &app
  build: .
  image: jobflow-api:local
  env_file: .env
  environment: &app-env
    NODE_ENV: production
    # Inside the compose network, Postgres is reachable by its service name.
    DB_HOST: postgres
    DB_PORT: 5432

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in .env}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes $ so the variable is expanded inside the container, not by compose.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off job: applies pending migrations, then exits 0.
  migrate:
    <<: *app
    command: ["node", "node_modules/typeorm/cli.js", "-d", "dist/database/data-source.js", "migration:run"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    environment:
      <<: *app-env
      PORT: 3000
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    depends_on:
      # API starts only after migrations finished successfully.
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
